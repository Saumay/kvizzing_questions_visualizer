[build]
  base = "v2/visualizer"
  command = "npm run build"
  publish = "v2/visualizer/build"

[[redirects]]
  from = "/question/*"
  to = "/200.html"
  status = 200

[[redirects]]
  from = "/session/*"
  to = "/200.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
